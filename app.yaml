kind: wasmer.io/App.v0
name: laravel  # اختر اسماً فريداً لتطبيقك
package: .                 # يشير إلى المجلد الحالي الذي يحتوي على wasmer.toml

# إعداد قاعدة البيانات
capabilities:
  database:
    engine: mysql          # محرك قاعدة البيانات

# تحديد المنطقة (ضروري لقواعد البيانات)
locality:
  regions:
    - fr-roub1             # يمكنك اختيار مناطق أخرى مثل us-ashburn أو de-falkenstein

# ربط متغيرات لارافيل بمتغيرات Wasmer
env:
  DB_CONNECTION: mysql
  DB_DATABASE: ${DB_NAME}  # Wasmer يمررها باسم DB_NAME ولارافيل يتوقعها DB_DATABASE
jobs:
  - name: run-migrations
    trigger: post-deployment
    action:
      execute:
        command: run  # يجب أن يطابق اسم الـ command في ملف wasmer.toml
        cli_args:
          - "artisan"
          - "migrate"
          - "--force"
